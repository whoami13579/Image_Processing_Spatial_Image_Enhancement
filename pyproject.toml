[project]
name = "spatial-image-enhancement"
version = "0.1.0"
description = "Manual spatial enhancement experiments for six grayscale images"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.scripts]
spatial-image-enhancement = "spatial_image_enhancement.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]
